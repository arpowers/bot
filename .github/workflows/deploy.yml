name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy --remote-only --yes \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_ID=$(date +%s)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.DISCORD_ERROR_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🚨 **Deploy failed** — commit `${{ github.sha }}`",
              "embeds": [{
                "color": 15548997,
                "title": "CI Deploy Failure",
                "description": "Check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "fields": [
                  {"name": "Commit", "value": "`${{ github.sha }}`", "inline": true},
                  {"name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true}
                ]
              }]
            }'
